[workspace]
resolver = "2"
members = [
    "crates/iptv-media",
    "crates/iptv-wasm",
    "crates/iptv-upstream",
    "crates/iptv-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
iptv-media = { path = "crates/iptv-media" }
iptv-wasm = { path = "crates/iptv-wasm" }
iptv-upstream = { path = "crates/iptv-upstream" }

aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4"
http-body-util = "0.1"
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# Compiling WASM modules at startup and in tests is dominated by wasmtime itself.
[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3
