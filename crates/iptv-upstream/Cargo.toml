[package]
name = "iptv-upstream"
description = "Upstream signing, API flow control and the per-channel segment pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Scripted HTTP transport and cipher factory for tests and benchmarks.
testkit = ["iptv-media/testkit"]

[dependencies]
aes = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
cbc = { workspace = true }
hex = { workspace = true }
md5 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
iptv-media = { workspace = true }
iptv-wasm = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
iptv-media = { workspace = true, features = ["testkit"] }

[[bench]]
name = "upstream"
harness = false
required-features = ["testkit"]

[lints]
workspace = true
